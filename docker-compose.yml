# Shared acme.sh env. Used by both the one-shot issuer and the renewal daemon so `docker compose up` provisions/renews certs
x-acme-env: &acme-env
  - HEALTHCHECK=${HEALTHCHECK:-}
  - CF_Token=${CF_TOKEN}
  - CF_Account_ID=${CF_ACCOUNT_ID}
  - CF_Zone_ID=${CF_ZONE_ID}
  - DOMAIN=${DOMAIN}
  - DEPLOY_DOCKER_CONTAINER_LABEL=sh.acme.autoload.domain=${DOMAIN}
  - DEPLOY_DOCKER_CONTAINER_KEY_FILE=/opt/ssl/key-ecc.pem
  - DEPLOY_DOCKER_CONTAINER_CERT_FILE=/opt/ssl/cert-ecc.pem
  - DEPLOY_DOCKER_CONTAINER_CA_FILE=/opt/ssl/ca-ecc.pem
  - DEPLOY_DOCKER_CONTAINER_FULLCHAIN_FILE=/opt/ssl/fullchain-ecc.pem
  - DEPLOY_DOCKER_CONTAINER_RELOAD_CMD=cat /opt/ssl/key-ecc.pem /opt/ssl/fullchain-ecc.pem > /opt/ssl/fullchain-key.pem.ecdsa; sv 2 haproxy 2>/dev/null; unbound-control reload_keep_cache 2>/dev/null; true

x-acme-image: &acme-image ghcr.io/acmesh-official/acme.sh:3.1.6@sha256:92b201ade090fb8551e221fba553fd7d7167628284cb28fe73bd64ec4a7f3a2b

x-acme-volumes: &acme-volumes
  - ./run/acmeout:/acme.sh
  - /var/run/docker.sock:/var/run/docker.sock

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.53.0/24
          ip_range: 172.30.53.128/25

volumes:
    dnscrypt:
    dnscrypt-server:
    ssl:
    nsd:
services:
  # set CA, issue the cert (acme.sh skips if still valid)
  acme:
    image: *acme-image
    container_name: acme
    restart: on-failure:2
    command:
      - /bin/sh
      - -ec
      - |
        acme.sh --set-default-ca --server letsencrypt || true
        issue_rc=0
        if [ -n "$$HEALTHCHECK" ]; then
          acme.sh --issue --dns dns_cf --dnssleep 60 -d "$$DOMAIN" --keylength ec-384 \
            --renew-hook "curl -fsS -m 10 --retry 5 -o /dev/null https://hc-ping.com/$$HEALTHCHECK" || issue_rc=$$?
        else
          acme.sh --issue --dns dns_cf --dnssleep 60 -d "$$DOMAIN" --keylength ec-384 || issue_rc=$$?
        fi
        deploy_rc=0
        acme.sh --deploy -d "$$DOMAIN" --ecc --deploy-hook docker || deploy_rc=$$?
        if { [ "$$issue_rc" -eq 0 ] || [ "$$issue_rc" -eq 2 ]; } && [ "$$deploy_rc" -eq 0 ]; then
          [ -n "$$HEALTHCHECK" ] && curl -fsS -m 10 --retry 5 -o /dev/null "https://hc-ping.com/$$HEALTHCHECK" || true
        else
          echo "acme: issue exit $$issue_rc, deploy exit $$deploy_rc" >&2
          [ -n "$$HEALTHCHECK" ] && curl -fsS -m 10 --retry 5 -o /dev/null "https://hc-ping.com/$$HEALTHCHECK/fail" || true
          exit 1
        fi
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    environment: *acme-env
    volumes: *acme-volumes

  # Renewal daemon: periodically renews and re-deploys certificates.
  acme-daemon:
    image: *acme-image
    container_name: acme-daemon
    restart: on-failure:5
    command: daemon
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    environment: *acme-env
    volumes: *acme-volumes

  nsd:
    container_name: nsd
    restart: on-failure:5
    build: nsd
    image: ghcr.io/publicarray/dns-resolver-infra/nsd
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    volumes:
      - nsd:/etc/nsd/run
    networks:
      default:
        ipv4_address: 172.30.53.10

  unbound:
    container_name: unbound
    restart: on-failure:5
    depends_on:
      - nsd
      - acme
    labels:
      - sh.acme.autoload.domain=${DOMAIN}
    build: unbound
    image: ghcr.io/publicarray/dns-resolver-infra/unbound
    environment:
      - NSD_SERVICE_HOST=172.30.53.10
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    ports:
      # DNS-over-QUIC (haproxy can't proxy DoQ)
      - "853:853/udp"
    volumes:
      # /opt/ssl = where acme.sh's docker deploy-hook writes the cert;
      # /etc/unbound/ssl = same volume inside unbound's chroot for reload.
      - ssl:/opt/ssl
      - ssl:/etc/unbound/ssl
    networks:
      default:
        ipv4_address: 172.30.53.53

  m13253-doh:
    container_name: doh
    restart: on-failure:5
    depends_on:
      - unbound
    build: m13253-doh
    image: ghcr.io/publicarray/dns-resolver-infra/m13253-doh
    environment:
      - UNBOUND_SERVICE_HOST=172.30.53.53
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    networks:
      default:
        ipv4_address: 172.30.53.80

  # doh-proxy:
  #   container_name: doh-proxy
  #   restart: on-failure:5
  #   depends_on:
  #     - unbound
  #   build: doh-proxy
  #   image: ghcr.io/publicarray/dns-resolver-infra/doh-proxy
  #   environment:
  #     - UNBOUND_SERVICE_HOST=172.30.53.53
  #   networks:
  #     default:
  #       ipv4_address: 172.30.53.81

  haproxy:
    container_name: haproxy
    restart: on-failure:5
    stop_grace_period: 35s
    depends_on:
      - acme
      - m13253-doh
      - unbound
    labels:
      - sh.acme.autoload.domain=${DOMAIN}
    build: haproxy
    image: ghcr.io/publicarray/dns-resolver-infra/haproxy
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    ports:
      - "80:80/tcp"     # redirects
      - "443:443/tcp"   # DoH
      - "443:443/udp"   # DoH3 (QUIC)
      - "853:853/tcp"   # DoT
      # 853/udp (DoQ) is served by unbound directly
    volumes:
       - ssl:/opt/ssl
    environment:
      - DOMAIN=${DOMAIN}
      - REDIRECTS=${REDIRECTS:-dns.seby.io=https://dns.seby.io www.dns.seby.io=https://dns.seby.io dot.seby.io=https://dns.seby.io www.dot.seby.io=https://dns.seby.io doh.seby.io=https://dns.seby.io www.doh.seby.io=https://dns.seby.io ntppool.org=https://www.ntppool.org/en/}
      - REDIRECT_DEFAULT=${REDIRECT_DEFAULT:-https://www.ntppool.org/en/}
      - UNBOUND_SERVICE_HOST=172.30.53.53
      - DOH_PROXY_SERVICE_HOST=172.30.53.80
    networks:
      default:
        ipv4_address: 172.30.53.43

