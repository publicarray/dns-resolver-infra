name: doh-proxy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'doh-proxy/**'
      - '.github/workflows/doh-proxy.yml'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      app: doh-proxy
      platforms: '[{"platform":"linux/amd64","runner":"ubuntu-latest"}]'
    secrets: inherit
