name: dnscrypt-server

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'dnscrypt-server/**'
      - '.github/workflows/dnscrypt-server.yml'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      app: dnscrypt-server
      platforms: '[{"platform":"linux/amd64","runner":"ubuntu-latest"}]'
    secrets: inherit
